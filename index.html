<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productivity Dashboard</title>

    <!-- Tailwind Dark Mode -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class"
        }
    </script>

</head>

<body
    class="min-h-screen bg-slate-100 text-slate-800 antialiased transition-colors duration-300 dark:bg-slate-950 dark:text-slate-100">

    <!-- Header -->
    <header
        class="flex flex-col gap-4 bg-indigo-700 px-6 py-5 text-white shadow-md transition-colors duration-300 dark:bg-slate-900 sm:flex-row sm:items-center sm:justify-between sm:px-10">

        <h2 class="text-2xl font-bold tracking-tight">
            Productivity Dashboard
        </h2>

        <ul class="flex flex-wrap items-center gap-4 text-sm">

            <li id="date-time" class="text-indigo-100 dark:text-slate-300"></li>

            <li>
                <button id="theme-btn"
                    class="rounded-lg border border-white/30 px-4 py-2 font-medium transition hover:bg-white/15">
                    Dark
                </button>
            </li>

        </ul>
    </header>


    <!-- Main -->
    <main class="mx-auto max-w-6xl px-4 py-8 sm:px-6 lg:px-8">

        <section id="dashboard" class="space-y-8">

            <!-- Weather -->
            <div id="weather"
                class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200 transition-colors duration-300 dark:bg-slate-900 dark:ring-slate-800">

                <h2 class="mb-4 text-xl font-semibold">
                    Weather
                </h2>

                <form id="handleWeather" class="flex flex-col gap-3 sm:flex-row">

                    <input id="city-input"
                        class="min-w-0 flex-1 rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 dark:border-slate-700 dark:bg-slate-800 dark:text-white dark:placeholder:text-slate-500 dark:focus:border-indigo-500 dark:focus:ring-indigo-900"
                        type="text" placeholder="Enter city name...">

                    <button
                        class="rounded-lg bg-indigo-600 px-5 py-2.5 font-semibold text-white transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2 dark:focus:ring-offset-slate-900">
                        Get Weather
                    </button>

                </form>

                <div id="weather-info">
                    
                </div>
            </div>


            <!-- Cards -->
            <div id="cards-grid" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">

                <div class="card cursor-pointer rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200 transition hover:-translate-y-1 hover:shadow-lg dark:bg-slate-900 dark:ring-slate-800"
                    data-feature="todo">

                    <h2 class="text-lg font-semibold">
                        TodoList
                    </h2>

                </div>


                <div class="card cursor-pointer rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200 transition hover:-translate-y-1 hover:shadow-lg dark:bg-slate-900 dark:ring-slate-800"
                    data-feature="plan">

                    <h2 class="text-lg font-semibold">
                        Day planner
                    </h2>

                </div>


                <div class="card cursor-pointer rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200 transition hover:-translate-y-1 hover:shadow-lg dark:bg-slate-900 dark:ring-slate-800"
                    data-feature="mov">

                    <h2 class="text-lg font-semibold">
                        Motivation
                    </h2>


                </div>


                <div class="card cursor-pointer rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200 transition hover:-translate-y-1 hover:shadow-lg dark:bg-slate-900 dark:ring-slate-800"
                    data-feature="pomo">

                    <h2 class="text-lg font-semibold">
                        Pomodoro
                    </h2>

                </div>


                <div class="card cursor-pointer rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200 transition hover:-translate-y-1 hover:shadow-lg dark:bg-slate-900 dark:ring-slate-800"
                    data-feature="goals">

                    <h2 class="text-lg font-semibold">
                        Goals
                    </h2>

                </div>

            </div>

        </section>


        <!-- Features -->
        <section id="features" class="mt-8">

            <!-- Todo -->
            <div id="todo"
                class="feature hidden rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200 transition-colors duration-300 dark:bg-slate-900 dark:ring-slate-800 sm:p-8">

                <button
                    class="back-btn mb-6 rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium transition hover:bg-slate-100 dark:border-slate-700 dark:hover:bg-slate-800">
                    Back
                </button>

                <h2 class="mb-5 text-2xl font-bold">
                    Todo task
                </h2>

                <form id="handleTask" class="mb-5 flex flex-col gap-3 sm:flex-row">

                    <input id="task-inp"
                        class="min-w-0 flex-1 rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-800 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 dark:border-slate-700 dark:bg-slate-800 dark:text-white dark:placeholder:text-slate-500 dark:focus:ring-indigo-900"
                        type="text" placeholder="Enter your task...">

                    <button
                        class="rounded-lg bg-indigo-600 px-5 py-2.5 font-semibold text-white transition hover:bg-indigo-700">
                        Add Task
                    </button>

                </form>

                <ul id="task-list" class="space-y-2"></ul>

            </div>


            <!-- Day Planner -->
            <div id="plan"
                class="feature hidden rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200 transition-colors duration-300 dark:bg-slate-900 dark:ring-slate-800 sm:p-8">

                <button
                    class="back-btn mb-6 rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium transition hover:bg-slate-100 dark:border-slate-700 dark:hover:bg-slate-800">
                    Back
                </button>

                <h2 class="mb-5 text-2xl font-bold">
                    Plan your day
                </h2>

                <form id="handlePlan" class="flex flex-col gap-3 sm:flex-row">

                    <input id="plan-inp"
                        class="min-w-0 flex-1 rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-800 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 dark:border-slate-700 dark:bg-slate-800 dark:text-white dark:placeholder:text-slate-500 dark:focus:ring-indigo-900"
                        type="text" placeholder="Add your plan ...">
                        <input id="plan-time"
                        class="min-w-0 flex-1 rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-800 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 dark:border-slate-700 dark:bg-slate-800 dark:text-white dark:placeholder:text-slate-500 dark:focus:ring-indigo-900"
                        type="time" placeholder="Add your plan ...">

                    <button
                        class="rounded-lg bg-indigo-600 px-5 py-2.5 font-semibold text-white transition hover:bg-indigo-700">
                        Add plan
                    </button>
                </form>

                <div id="plan-display">
                    <h2 class="mb-5 text-2xl font-bold mt-5 mb-5">
                        My Plans
                    </h2>
                    <ul id="plan-list" class="space-y-2"></ul>
                </div>

            </div>


            <!-- Motivation -->
            <div id="mov"
                class="feature hidden rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200 transition-colors duration-300 dark:bg-slate-900 dark:ring-slate-800 sm:p-8">

                <button
                    class="back-btn mb-6 rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium transition hover:bg-slate-100 dark:border-slate-700 dark:hover:bg-slate-800">
                    Back
                </button>

                <h2 class="text-2xl font-bold">
                    Motivation
                </h2>

                <p id="quote-text" class="mt-3 text-sm italic leading-relaxed text-slate-600 dark:text-slate-300"></p>
                <p id="quote-author" class="mt-2 text-right text-xs font-medium text-slate-500 dark:text-slate-400"></p>
                <button id="new-quote-btn" type="button"
                    class="mt-4 rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 dark:bg-indigo-500 dark:hover:bg-indigo-400 dark:focus:ring-offset-slate-900">New
                    quote</button>

            </div>


            <!-- Pomodoro -->
            <div id="pomo"
                class="feature hidden rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200 transition-colors duration-300 dark:bg-slate-900 dark:ring-slate-800 sm:p-8">

                <button
                    class="back-btn mb-6 rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium transition hover:bg-slate-100 dark:border-slate-700 dark:hover:bg-slate-800">
                    Back
                </button>

                <h2 class="mb-5 text-2xl font-bold">
                    Pomodoro
                </h2>

                <div id="pomo-time" class="mb-5 text-4xl font-bold tabular-nums text-indigo-700 dark:text-indigo-400">
                    25:00
                </div>

                <button id="pomo-btn"
                    class="rounded-lg bg-indigo-600 px-5 py-2.5 font-semibold text-white transition hover:bg-indigo-700">
                    Start
                </button>

            </div>


            <!-- Goals -->
            <div id="goals"
                class="feature hidden rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200 transition-colors duration-300 dark:bg-slate-900 dark:ring-slate-800 sm:p-8">

                <button
                    class="back-btn mb-6 rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium transition hover:bg-slate-100 dark:border-slate-700 dark:hover:bg-slate-800">
                    Back
                </button>

                <h2 class="mb-5 text-2xl font-bold">
                    Set your goals
                </h2>
                <form id="handleGoal" class="mb-5 flex flex-col gap-3 sm:flex-row">
                    <select name="" id="goal"
                        class="w-full max-w-sm rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-800 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 dark:border-slate-700 dark:bg-slate-800 dark:text-white dark:focus:border-indigo-500 dark:focus:ring-indigo-900">
                        <option value="gym">Fitness</option>
                        <option value="study">Weight Loss</option>
                        <option value="trading">Weight Gain</option>
                        <option value="reading">Money</option>
                        <option value="coding">Increase Height</option>

                    </select>
                    <button
                        class="rounded-lg bg-indigo-600 px-5 py-2.5 font-semibold text-white transition hover:bg-indigo-700">
                        Set Goal
                    </button>
                </form>
                <h2 class="text-xl font-bold mb-5">My Yearly Goals</h2> 
                <hr>

                <p class="text-lg font-semibold mb-5 mt-3" id="goal-progress"></p>
               
                <ul id="goal-list" class="space-y-2">

                </ul>


            </div>

        </section>

    </main>


    <script src="app.js"></script>

</body>

</html>
